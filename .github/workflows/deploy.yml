name: Deploy to GitHub Pages

# Every merge to main publishes the simulator. Also runnable by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically the first time this runs, so the
          # repo needs no manual setup in Settings.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The simulator is a single self-contained index.html at the
          # repo root, so the root is the site.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
