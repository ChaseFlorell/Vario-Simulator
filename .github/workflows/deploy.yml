name: Deploy to GitHub Pages

# Every merge to main publishes the simulator. Also runnable by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing to the gh-pages branch needs nothing but write access to the
# repo, so this works without an admin first enabling Pages by hand.
permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The simulator is a single self-contained index.html, so the
          # published site is just that file.
          site="$(mktemp -d)"
          cp index.html "$site/"
          touch "$site/.nojekyll"          # serve the file as-is, no Jekyll

          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}"

          # The branch is generated output, so replacing it each time is
          # correct — there is no history worth keeping.
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Where it landed
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          echo "Published to https://${owner,,}.github.io/${repo}/" >> "$GITHUB_STEP_SUMMARY"
